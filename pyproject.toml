[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zls-event-collect"
version = "0.2.0"
description = "ゾンビランドサガ公式NEWSからイベント候補を収集・正規化するツール"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12,<5",
    "requests>=2.32,<3",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3,<9",
]

[project.scripts]
zls-event-collect = "zls_event_collect.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
